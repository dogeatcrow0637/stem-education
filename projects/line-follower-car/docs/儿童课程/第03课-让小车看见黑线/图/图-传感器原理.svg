<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="PingFang SC,Microsoft YaHei,sans-serif">
  <rect width="820" height="460" fill="#0f1220"/>
  <text x="410" y="44" fill="#ffd166" font-size="28" text-anchor="middle" font-weight="bold">探头怎么"看见"黑线？</text>

  <!-- 白色面板 -->
  <text x="205" y="100" fill="#63e6be" font-size="22" text-anchor="middle">白纸：光会弹回来</text>
  <rect x="60" y="120" width="290" height="30" rx="6" fill="#26304f" stroke="#9aa3b8"/>
  <text x="205" y="142" fill="#f7f8fb" font-size="16" text-anchor="middle">探头</text>
  <rect x="120" y="150" width="24" height="24" rx="5" fill="#ffd166"/>
  <rect x="250" y="150" width="24" height="24" rx="5" fill="#4cc9f0"/>
  <path d="M132 174 L205 330" stroke="#ffd166" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M205 330 L262 174" stroke="#4cc9f0" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="80" y="330" width="250" height="26" rx="6" fill="#eef1f7"/>
  <text x="205" y="349" fill="#0f1220" font-size="15" text-anchor="middle">白色地面</text>
  <text x="205" y="400" fill="#63e6be" font-size="18" text-anchor="middle">弹回来的光多 → 判定"白"</text>

  <!-- 黑色面板 -->
  <text x="615" y="100" fill="#ffd166" font-size="22" text-anchor="middle">黑线：光被吃掉了</text>
  <rect x="470" y="120" width="290" height="30" rx="6" fill="#26304f" stroke="#9aa3b8"/>
  <text x="615" y="142" fill="#f7f8fb" font-size="16" text-anchor="middle">探头</text>
  <rect x="530" y="150" width="24" height="24" rx="5" fill="#ffd166"/>
  <rect x="672" y="150" width="24" height="24" rx="5" fill="#4cc9f0"/>
  <path d="M542 174 L615 330" stroke="#ffd166" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="520" y="330" width="190" height="26" rx="6" fill="#1a1a1a" stroke="#6b7488"/>
  <text x="615" y="349" fill="#cfd6e4" font-size="15" text-anchor="middle">黑色胶带</text>
  <text x="615" y="400" fill="#ffd166" font-size="18" text-anchor="middle">弹回来的光少 → 判定"黑"</text>
</svg>
