<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="PingFang SC,Microsoft YaHei,sans-serif">
  <rect width="800" height="520" fill="#0f1220"/>
  <text x="400" y="46" fill="#ffd166" font-size="30" text-anchor="middle" font-weight="bold">循迹小车 · 整机</text>

  <!-- 俯视图 -->
  <text x="110" y="100" fill="#4cc9f0" font-size="20">俯视图</text>
  <rect x="90" y="120" width="280" height="300" rx="16" fill="#1b2340" stroke="#4cc9f0" stroke-width="3"/>
  <!-- 轮子 -->
  <rect x="66" y="150" width="34" height="90" rx="10" fill="#2e3a63" stroke="#9aa3b8"/>
  <rect x="66" y="300" width="34" height="90" rx="10" fill="#2e3a63" stroke="#9aa3b8"/>
  <rect x="360" y="150" width="34" height="90" rx="10" fill="#2e3a63" stroke="#9aa3b8"/>
  <rect x="360" y="300" width="34" height="90" rx="10" fill="#2e3a63" stroke="#9aa3b8"/>
  <text x="83" y="440" fill="#9aa3b8" font-size="14" text-anchor="middle">左轮</text>
  <text x="377" y="440" fill="#9aa3b8" font-size="14" text-anchor="middle">右轮</text>
  <!-- 板子 -->
  <rect x="130" y="170" width="90" height="70" rx="8" fill="#26304f" stroke="#9aa3b8"/>
  <text x="175" y="212" fill="#f7f8fb" font-size="15" text-anchor="middle">UNO</text>
  <rect x="240" y="170" width="90" height="70" rx="8" fill="#26304f" stroke="#9aa3b8"/>
  <text x="285" y="212" fill="#f7f8fb" font-size="15" text-anchor="middle">L298N</text>
  <rect x="140" y="290" width="200" height="80" rx="8" fill="#26304f" stroke="#9aa3b8"/>
  <text x="240" y="338" fill="#f7f8fb" font-size="15" text-anchor="middle">4 节电池盒</text>
  <!-- 探头 -->
  <circle cx="190" cy="140" r="16" fill="#ffd166"/><circle cx="270" cy="140" r="16" fill="#ffd166"/>
  <text x="230" y="126" fill="#ffd166" font-size="14" text-anchor="middle">循迹探头</text>
  <!-- 万向轮 -->
  <circle cx="230" cy="410" r="14" fill="#2e3a63" stroke="#9aa3b8"/>
  <text x="230" y="446" fill="#9aa3b8" font-size="14" text-anchor="middle">万向轮</text>

  <!-- 侧视图 -->
  <text x="530" y="100" fill="#4cc9f0" font-size="20">侧视图（看高度）</text>
  <line x1="470" y1="360" x2="770" y2="360" stroke="#3a4570" stroke-width="3"/>
  <rect x="500" y="230" width="230" height="40" rx="8" fill="#26304f" stroke="#9aa3b8"/>
  <text x="615" y="257" fill="#f7f8fb" font-size="15" text-anchor="middle">底盘</text>
  <circle cx="530" cy="330" r="34" fill="#2e3a63" stroke="#9aa3b8"/>
  <circle cx="700" cy="335" r="22" fill="#2e3a63" stroke="#9aa3b8"/>
  <rect x="470" y="285" width="26" height="26" rx="6" fill="#ffd166"/>
  <text x="483" y="278" fill="#ffd166" font-size="13" text-anchor="middle">探头</text>
  <line x1="483" y1="312" x2="483" y2="358" stroke="#63e6be" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="620" y="330" fill="#63e6be" font-size="15">离地 8–12mm</text>
  <line x1="596" y1="318" x2="520" y2="330" stroke="#63e6be" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
