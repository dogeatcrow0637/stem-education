<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="PingFang SC,Microsoft YaHei,sans-serif">
  <rect width="820" height="520" fill="#0f1220"/>
  <text x="410" y="42" fill="#ffd166" font-size="28" text-anchor="middle" font-weight="bold">接线示意（按编号插线）</text>

  <!-- UNO -->
  <rect x="40" y="150" width="220" height="230" rx="14" fill="#1b2340" stroke="#4cc9f0" stroke-width="3"/>
  <text x="150" y="185" fill="#f7f8fb" font-size="24" text-anchor="middle">主控 UNO</text>
  <text x="60" y="240" fill="#ffd166" font-size="17">5V ●</text>
  <text x="60" y="272" fill="#f7f8fb" font-size="17">GND ●</text>
  <text x="60" y="304" fill="#f7f8fb" font-size="17">D5 ●(PWM)</text>
  <text x="60" y="336" fill="#f7f8fb" font-size="17">D6 ●(PWM)</text>
  <text x="160" y="240" fill="#f7f8fb" font-size="17">D7 ●</text>
  <text x="160" y="272" fill="#f7f8fb" font-size="17">D8 ●</text>
  <text x="160" y="304" fill="#f7f8fb" font-size="17">D9 ●</text>
  <text x="160" y="336" fill="#f7f8fb" font-size="17">D10 ●</text>
  <text x="60" y="368" fill="#63e6be" font-size="17">A0 ● 左探头</text>
  <text x="160" y="368" fill="#63e6be" font-size="17">A1 ● 右探头</text>

  <!-- L298N -->
  <rect x="470" y="120" width="310" height="180" rx="14" fill="#1b2340" stroke="#4cc9f0" stroke-width="3"/>
  <text x="625" y="155" fill="#f7f8fb" font-size="24" text-anchor="middle">驱动板 L298N</text>
  <text x="490" y="205" fill="#ff6b6b" font-size="17">12V ● ← 电池 +</text>
  <text x="490" y="237" fill="#f7f8fb" font-size="17">GND ● ← 电池 −</text>
  <text x="490" y="269" fill="#f7f8fb" font-size="17">ENA/IN1..IN4 ● ← UNO</text>
  <text x="700" y="205" fill="#9aa3b8" font-size="16">OUT1/2</text>
  <text x="700" y="237" fill="#9aa3b8" font-size="16">OUT3/4</text>

  <!-- 电机 -->
  <rect x="470" y="330" width="140" height="70" rx="12" fill="#26304f" stroke="#9aa3b8"/>
  <text x="540" y="372" fill="#f7f8fb" font-size="18" text-anchor="middle">左电机</text>
  <rect x="640" y="330" width="140" height="70" rx="12" fill="#26304f" stroke="#9aa3b8"/>
  <text x="710" y="372" fill="#f7f8fb" font-size="18" text-anchor="middle">右电机</text>

  <!-- 电池 -->
  <rect x="60" y="410" width="180" height="70" rx="12" fill="#26304f" stroke="#63e6be" stroke-width="3"/>
  <text x="150" y="452" fill="#f7f8fb" font-size="18" text-anchor="middle">电池盒 4×AA</text>

  <!-- 循迹 -->
  <rect x="270" y="410" width="180" height="70" rx="12" fill="#26304f" stroke="#ffd166" stroke-width="3"/>
  <text x="360" y="452" fill="#f7f8fb" font-size="18" text-anchor="middle">循迹探头</text>

  <!-- 连线 -->
  <line x1="260" y1="240" x2="470" y2="212" stroke="#ff6b6b" stroke-width="3"/>
  <line x1="160" y1="272" x2="470" y2="237" stroke="#e6e6e6" stroke-width="3"/>
  <line x1="230" y1="300" x2="470" y2="265" stroke="#4cc9f0" stroke-width="3"/>
  <line x1="160" y1="415" x2="160" y2="385" stroke="#63e6be" stroke-width="3"/>
  <line x1="240" y1="452" x2="270" y2="452" stroke="#ffd166" stroke-width="3"/>
  <text x="300" y="150" fill="#ff6b6b" font-size="16">红线=正 黑线=负</text>
  <text x="300" y="176" fill="#9aa3b8" font-size="16">两块板的 GND 必须相连</text>
</svg>
