<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<rect width="960" height="540" fill="#0f1220"/>
<text x="480" y="44" fill="#ffd166" font-size="30" text-anchor="middle" font-weight="700">蒸发带走的只是水</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4cc9f0"/></marker></defs>
<rect x="120" y="130" width="300" height="220" rx="10" fill="#12243a" stroke="#4cc9f0" stroke-width="2"/>
<text x="270.0" y="247.7" fill="#cfe8ff" font-size="22" text-anchor="middle" font-weight="600">缸水 盐度 1.024</text>
<line x1="430" y1="190" x2="560" y2="190" stroke="#4cc9f0" stroke-width="3" marker-end="url(#b)"/>
<text x="495" y="172" fill="#4cc9f0" font-size="18" text-anchor="middle" font-weight="400">只走水</text>
<rect x="570" y="110" width="270" height="110" rx="10" fill="#151a2b" stroke="#9aa3b8" stroke-width="2"/>
<text x="705.0" y="171.3" fill="#9aa3b8" font-size="18" text-anchor="middle" font-weight="600">水蒸气 跑了</text>
<rect x="570" y="250" width="270" height="110" rx="10" fill="#151a2b" stroke="#ffd166" stroke-width="2"/>
<text x="705.0" y="311.3" fill="#ffd166" font-size="18" text-anchor="middle" font-weight="600">盐 留在缸里</text>
<text x="480" y="420" fill="#63e6be" font-size="22" text-anchor="middle" font-weight="700">蒸发了 → 补纯水（不加盐）</text>
<text x="480" y="462" fill="#ffd166" font-size="22" text-anchor="middle" font-weight="700">换水 → 才用盐水（要测盐度）</text>
</svg>
