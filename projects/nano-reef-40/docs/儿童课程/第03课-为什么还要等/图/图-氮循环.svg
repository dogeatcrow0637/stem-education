<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<rect width="960" height="540" fill="#0f1220"/>
<text x="480" y="44" fill="#ffd166" font-size="30" text-anchor="middle" font-weight="700">鱼的便便去哪了</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4cc9f0"/></marker></defs>
<rect x="40" y="170" width="200" height="130" rx="10" fill="#151a2b" stroke="#ff6b6b" stroke-width="2"/>
<text x="140.0" y="233.0" fill="#ff6b6b" font-size="19" text-anchor="middle" font-weight="600">氨 NH₃</text>
<text x="140.0" y="261.0" fill="#9aa3b8" font-size="14" text-anchor="middle" font-weight="400">剧毒 · 来自鱼粪</text>
<line x1="245" y1="235" x2="266" y2="235" stroke="#ffd166" stroke-width="3" marker-end="url(#a)"/>
<rect x="270" y="170" width="200" height="130" rx="10" fill="#151a2b" stroke="#ffd166" stroke-width="2"/>
<text x="370.0" y="233.0" fill="#ffd166" font-size="19" text-anchor="middle" font-weight="600">亚硝酸盐 NO₂</text>
<text x="370.0" y="261.0" fill="#9aa3b8" font-size="14" text-anchor="middle" font-weight="400">有毒 · 中间产物</text>
<line x1="475" y1="235" x2="496" y2="235" stroke="#ffd166" stroke-width="3" marker-end="url(#a)"/>
<rect x="500" y="170" width="200" height="130" rx="10" fill="#151a2b" stroke="#63e6be" stroke-width="2"/>
<text x="600.0" y="233.0" fill="#63e6be" font-size="19" text-anchor="middle" font-weight="600">硝酸盐 NO₃</text>
<text x="600.0" y="261.0" fill="#9aa3b8" font-size="14" text-anchor="middle" font-weight="400">低毒 · 能换水带走</text>
<line x1="705" y1="235" x2="726" y2="235" stroke="#ffd166" stroke-width="3" marker-end="url(#a)"/>
<rect x="730" y="170" width="200" height="130" rx="10" fill="#151a2b" stroke="#4cc9f0" stroke-width="2"/>
<text x="830.0" y="233.0" fill="#4cc9f0" font-size="19" text-anchor="middle" font-weight="600">换水 / 藻吸收</text>
<text x="830.0" y="261.0" fill="#9aa3b8" font-size="14" text-anchor="middle" font-weight="400">稀释掉</text>
<text x="140" y="340" fill="#9aa3b8" font-size="17" text-anchor="middle" font-weight="400">↑ 硝化细菌 1</text>
<text x="370" y="340" fill="#9aa3b8" font-size="17" text-anchor="middle" font-weight="400">↑ 硝化细菌 2</text>
<text x="480" y="420" fill="#f7f8fb" font-size="20" text-anchor="middle" font-weight="400">看不见的细菌住在石头里干活</text>
<text x="480" y="468" fill="#ffd166" font-size="22" text-anchor="middle" font-weight="700">它们长大，需要 4–8 周</text>
</svg>
