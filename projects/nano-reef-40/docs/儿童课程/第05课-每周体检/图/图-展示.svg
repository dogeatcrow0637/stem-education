<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<rect width="960" height="540" fill="#0f1220"/>
<text x="480" y="44" fill="#ffd166" font-size="30" text-anchor="middle" font-weight="700">讲给家人听</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4cc9f0"/></marker></defs>
<rect x="80" y="130" width="360" height="120" rx="10" fill="#151a2b" stroke="#4cc9f0" stroke-width="2"/>
<text x="260.0" y="188.0" fill="#4cc9f0" font-size="22" text-anchor="middle" font-weight="600">我要讲 3 分钟</text>
<text x="260.0" y="216.0" fill="#9aa3b8" font-size="17" text-anchor="middle" font-weight="400">它是什么</text>
<rect x="520" y="130" width="360" height="120" rx="10" fill="#151a2b" stroke="#ffd166" stroke-width="2"/>
<text x="700.0" y="188.0" fill="#ffd166" font-size="22" text-anchor="middle" font-weight="600">最难的地方</text>
<text x="700.0" y="216.0" fill="#9aa3b8" font-size="17" text-anchor="middle" font-weight="400">我试了几次</text>
<rect x="80" y="290" width="360" height="120" rx="10" fill="#151a2b" stroke="#63e6be" stroke-width="2"/>
<text x="260.0" y="348.0" fill="#63e6be" font-size="22" text-anchor="middle" font-weight="600">怎么做的</text>
<text x="260.0" y="376.0" fill="#9aa3b8" font-size="17" text-anchor="middle" font-weight="400">先…然后…最后…</text>
<rect x="520" y="290" width="360" height="120" rx="10" fill="#151a2b" stroke="#ffd166" stroke-width="2"/>
<text x="700.0" y="348.0" fill="#ffd166" font-size="22" text-anchor="middle" font-weight="600">还想改什么</text>
<text x="700.0" y="376.0" fill="#9aa3b8" font-size="17" text-anchor="middle" font-weight="400">下一步的计划</text>
<text x="480" y="482" fill="#f7f8fb" font-size="22" text-anchor="middle" font-weight="600">这是我这口缸的故事</text>
</svg>
