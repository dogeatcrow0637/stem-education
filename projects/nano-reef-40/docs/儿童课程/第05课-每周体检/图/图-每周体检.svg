<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
<rect width="960" height="540" fill="#0f1220"/>
<text x="480" y="44" fill="#ffd166" font-size="30" text-anchor="middle" font-weight="700">每周给缸做一次体检</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4cc9f0"/></marker></defs>
<rect x="40" y="120" width="160" height="150" rx="10" fill="#151a2b" stroke="#63e6be" stroke-width="2"/>
<text x="120.0" y="193.0" fill="#63e6be" font-size="19" text-anchor="middle" font-weight="600">盐度计</text>
<text x="120.0" y="221.0" fill="#9aa3b8" font-size="14" text-anchor="middle" font-weight="400">1.024–1.026</text>
<rect x="220" y="120" width="160" height="150" rx="10" fill="#151a2b" stroke="#ffd166" stroke-width="2"/>
<text x="300.0" y="193.0" fill="#ffd166" font-size="19" text-anchor="middle" font-weight="600">温度计</text>
<text x="300.0" y="221.0" fill="#9aa3b8" font-size="14" text-anchor="middle" font-weight="400">25–26℃</text>
<rect x="400" y="120" width="160" height="150" rx="10" fill="#151a2b" stroke="#ff6b6b" stroke-width="2"/>
<text x="480.0" y="193.0" fill="#ff6b6b" font-size="19" text-anchor="middle" font-weight="600">测试剂</text>
<text x="480.0" y="221.0" fill="#9aa3b8" font-size="14" text-anchor="middle" font-weight="400">氨 / 亚硝酸盐 = 0</text>
<rect x="580" y="120" width="160" height="150" rx="10" fill="#151a2b" stroke="#4cc9f0" stroke-width="2"/>
<text x="660.0" y="193.0" fill="#4cc9f0" font-size="19" text-anchor="middle" font-weight="600">KH 试剂</text>
<text x="660.0" y="221.0" fill="#9aa3b8" font-size="14" text-anchor="middle" font-weight="400">7–9 dKH</text>
<rect x="760" y="120" width="160" height="150" rx="10" fill="#151a2b" stroke="#f7f8fb" stroke-width="2"/>
<text x="840.0" y="193.0" fill="#f7f8fb" font-size="19" text-anchor="middle" font-weight="600">记录表</text>
<text x="840.0" y="221.0" fill="#9aa3b8" font-size="14" text-anchor="middle" font-weight="400">每周写一行</text>
<rect x="90" y="320" width="780" height="150" rx="10" fill="#12243a" stroke="#4cc9f0" stroke-width="2"/>
<text x="480.0" y="402.0" fill="#cfe8ff" font-size="20" text-anchor="middle" font-weight="600">本周记录：日期 ／ 盐度 ／ 温度 ／ 氨 ／ 亚硝酸盐 ／ 硝酸盐 ／ 我今天做了什么</text>
<text x="480" y="512" fill="#ffd166" font-size="20" text-anchor="middle" font-weight="600">空一栏，将来就少一条线索</text>
</svg>
