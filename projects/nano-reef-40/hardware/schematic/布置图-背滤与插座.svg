<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="560" fill="#f7fbfd"/>
  <text x="430" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#0b3d5c">40 方背滤缸 · 背滤三格与插座布置</text>

  <!-- 主缸 -->
  <rect x="70" y="80" width="500" height="330" fill="#dff1f9" stroke="#2b7ea8" stroke-width="3"/>
  <text x="320" y="115" font-size="16" text-anchor="middle" fill="#0b3d5c">主缸（展示区）</text>
  <text x="320" y="140" font-size="13" text-anchor="middle" fill="#4a7f99">约 40 × 40cm · 水位约 35cm</text>

  <!-- 造景石 -->
  <path d="M150 360 L200 280 L250 320 L300 260 L350 330 L400 300 L430 360 Z" fill="#b9b2a5" stroke="#8c8577" stroke-width="2"/>
  <text x="290" y="392" font-size="12" text-anchor="middle" fill="#6b6558">人工造景石（留 2 个洞给鱼躲）</text>

  <!-- 造浪 -->
  <circle cx="110" cy="150" r="16" fill="#ffffff" stroke="#2b7ea8" stroke-width="2"/>
  <text x="110" y="155" font-size="11" text-anchor="middle" fill="#2b7ea8">造浪</text>
  <path d="M128 150 q22 -12 44 0 q22 12 44 0" fill="none" stroke="#63b3d6" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- 灯 -->
  <rect x="120" y="62" width="400" height="14" rx="4" fill="#ffe08a" stroke="#c9a227" stroke-width="2"/>
  <text x="320" y="56" font-size="12" text-anchor="middle" fill="#8a6d12">18W 珊瑚夹灯（定时 8h/天）</text>

  <!-- 背滤仓 -->
  <rect x="570" y="80" width="210" height="330" fill="#e8f4ea" stroke="#2f8f4e" stroke-width="3"/>
  <text x="675" y="108" font-size="16" text-anchor="middle" fill="#1e6b39">背滤三格</text>

  <rect x="585" y="125" width="180" height="80" fill="#ffffff" stroke="#2f8f4e" stroke-width="2"/>
  <text x="675" y="152" font-size="13" text-anchor="middle" fill="#1e6b39">① 进水格</text>
  <text x="675" y="174" font-size="12" text-anchor="middle" fill="#4d7f5c">滤棉 → 生化球/陶瓷环</text>
  <text x="675" y="193" font-size="11" text-anchor="middle" fill="#7a9c85">￥10 + ￥15</text>

  <rect x="585" y="215" width="180" height="80" fill="#ffffff" stroke="#2f8f4e" stroke-width="2"/>
  <text x="675" y="242" font-size="13" text-anchor="middle" fill="#1e6b39">② 蛋分格</text>
  <text x="675" y="264" font-size="12" text-anchor="middle" fill="#4d7f5c">蛋白质分离器</text>
  <text x="675" y="283" font-size="11" text-anchor="middle" fill="#7a9c85">￥59（海水缸心脏）</text>

  <rect x="585" y="305" width="180" height="90" fill="#ffffff" stroke="#2f8f4e" stroke-width="2"/>
  <text x="675" y="332" font-size="13" text-anchor="middle" fill="#1e6b39">③ 出水格</text>
  <text x="675" y="354" font-size="12" text-anchor="middle" fill="#4d7f5c">回水泵 600–1200 L/h</text>
  <text x="675" y="373" font-size="11" text-anchor="middle" fill="#7a9c85">￥45</text>
  <text x="675" y="389" font-size="11" text-anchor="middle" fill="#7a9c85">水位须淹没过泵</text>

  <!-- 水流箭头 -->
  <path d="M320 410 q0 60 -140 60 q-140 0 -140 -60" fill="none" stroke="#63b3d6" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#63b3d6"/></marker></defs>
  <text x="180" y="480" font-size="12" fill="#2b7ea8">水从背滤第三格回流主缸</text>

  <!-- 插座区 -->
  <rect x="70" y="500" width="710" height="44" rx="8" fill="#fff4e6" stroke="#d98b2b" stroke-width="2"/>
  <text x="90" y="528" font-size="13" fill="#8a5512">墙上插座 → 漏电保护插头 → 排插 → ①泵 ②蛋分 ③造浪 ④灯(定时) ⑤加热棒(温控 · 26℃启/25℃停)</text>
</svg>
