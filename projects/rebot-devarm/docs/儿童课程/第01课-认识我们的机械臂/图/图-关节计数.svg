<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="800" height="600" fill="#101528"/>
  <text x="400" y="52" fill="#ffd166" font-size="34" text-anchor="middle" font-weight="bold">数一数：一共有几个关节？</text>

  <line x1="120" y1="500" x2="700" y2="500" stroke="#3a4360" stroke-width="4"/>

  <!-- shoulder chain -->
  <circle cx="150" cy="470" r="22" fill="#ffd166"/><text x="150" y="478" fill="#0f1220" font-size="20" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="215" cy="410" r="22" fill="#ffd166"/><text x="215" y="418" fill="#0f1220" font-size="20" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="290" cy="350" r="22" fill="#ffd166"/><text x="290" y="358" fill="#0f1220" font-size="20" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="370" cy="300" r="22" fill="#ffd166"/><text x="370" y="308" fill="#0f1220" font-size="20" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="455" cy="262" r="22" fill="#ffd166"/><text x="455" y="270" fill="#0f1220" font-size="20" text-anchor="middle" font-weight="bold">5</text>
  <circle cx="540" cy="238" r="22" fill="#ffd166"/><text x="540" y="246" fill="#0f1220" font-size="20" text-anchor="middle" font-weight="bold">6</text>
  <circle cx="628" cy="226" r="22" fill="#f4a261"/><text x="628" y="234" fill="#0f1220" font-size="20" text-anchor="middle" font-weight="bold">7</text>

  <path d="M150 470 Q200 430 215 410 M215 410 Q250 375 290 350 M290 350 Q330 320 370 300 M370 300 Q415 278 455 262 M455 262 Q500 246 540 238 M540 238 Q585 230 628 226"
        fill="none" stroke="#63e6be" stroke-width="8" stroke-linecap="round"/>

  <text x="628" y="180" fill="#f4a261" font-size="22" text-anchor="middle">第 7 个管夹爪</text>
  <text x="180" y="546" fill="#9aa3b8" font-size="22">1–6 号让手臂摆姿势</text>
  <text x="520" y="546" fill="#9aa3b8" font-size="22">7 号负责开合</text>
</svg>
