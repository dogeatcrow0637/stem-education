<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="800" height="600" fill="#101528"/>
  <text x="400" y="52" fill="#ffd166" font-size="34" text-anchor="middle" font-weight="bold">机械臂的五个部位</text>

  <!-- base -->
  <rect x="150" y="470" width="180" height="46" rx="8" fill="#4cc9f0"/>
  <text x="240" y="500" fill="#0f1220" font-size="24" text-anchor="middle" font-weight="bold">底座</text>

  <!-- joint 1 -->
  <circle cx="240" cy="440" r="26" fill="#ffd166"/>
  <text x="240" y="449" fill="#0f1220" font-size="24" text-anchor="middle" font-weight="bold">1</text>

  <!-- big arm -->
  <rect x="228" y="250" width="24" height="170" rx="10" fill="#63e6be"/>
  <text x="300" y="320" fill="#63e6be" font-size="24">大臂</text>

  <!-- joint 2 -->
  <circle cx="240" cy="240" r="26" fill="#ffd166"/>
  <text x="240" y="249" fill="#0f1220" font-size="24" text-anchor="middle" font-weight="bold">2</text>

  <!-- forearm -->
  <rect x="240" y="150" width="200" height="22" rx="10" fill="#63e6be"/>
  <text x="330" y="140" fill="#63e6be" font-size="24">小臂</text>

  <!-- joint 3 -->
  <circle cx="452" cy="161" r="26" fill="#ffd166"/>
  <text x="452" y="170" fill="#0f1220" font-size="24" text-anchor="middle" font-weight="bold">3</text>

  <!-- wrist -->
  <rect x="470" y="120" width="120" height="20" rx="9" fill="#63e6be"/>
  <text x="530" y="108" fill="#63e6be" font-size="24">腕部</text>

  <!-- gripper -->
  <path d="M600 100 l40 -26 l14 20 l-40 26 z" fill="#f4a261"/>
  <path d="M600 142 l40 26 l14 -20 l-40 -26 z" fill="#f4a261"/>
  <text x="646" y="230" fill="#f4a261" font-size="24">夹爪</text>

  <text x="400" y="566" fill="#9aa3b8" font-size="22" text-anchor="middle">先认部位，再数关节</text>
</svg>
