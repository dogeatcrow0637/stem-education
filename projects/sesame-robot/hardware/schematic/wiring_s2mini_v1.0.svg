<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="820" fill="#f7f9fc"/>
  <text x="600" y="42" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">Sesame Robot · S2 Mini 手接线示意</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#6b7280">图看走向，编号以 hardware/schematic/wiring_s2mini_v1.0.md 端子表为准</text>

  <!-- ESP32 -->
  <rect x="430" y="120" width="340" height="220" rx="18" fill="#111827" stroke="#4cc9f0" stroke-width="3"/>
  <text x="600" y="160" text-anchor="middle" font-size="24" font-weight="bold" fill="#f7f8fb">Lolin S2 Mini</text>
  <text x="600" y="195" text-anchor="middle" font-size="16" fill="#9aa3b8">ESP32-S2 · USB-C · 5V/3A</text>
  <text x="600" y="235" text-anchor="middle" font-size="15" fill="#ffd166">SDA GPIO33 / SCL GPIO35</text>
  <text x="600" y="268" text-anchor="middle" font-size="15" fill="#63e6be">舵机信号 GPIO 1 2 4 6 8 10 13 14</text>
  <text x="600" y="305" text-anchor="middle" font-size="14" fill="#9aa3b8">USB CDC On Boot = Enabled</text>

  <!-- power rail -->
  <rect x="80" y="400" width="1040" height="70" rx="12" fill="#fff" stroke="#ef4444" stroke-width="2"/>
  <text x="110" y="443" font-size="18" font-weight="bold" fill="#ef4444">5V 轨（22AWG 红）</text>
  <text x="430" y="443" font-size="15" fill="#6b7280">8×舵机红线 + OLED VCC + S2 Mini 5V</text>
  <text x="1010" y="443" text-anchor="end" font-size="15" fill="#6b7280">5V/3A 以上</text>

  <rect x="80" y="490" width="1040" height="70" rx="12" fill="#fff" stroke="#374151" stroke-width="2"/>
  <text x="110" y="533" font-size="18" font-weight="bold" fill="#374151">GND 轨（22AWG 棕/黑）</text>
  <text x="430" y="533" font-size="15" fill="#6b7280">8×舵机棕线 + OLED GND + S2 Mini GND</text>
  <text x="1010" y="533" text-anchor="end" font-size="15" fill="#6b7280">全部共地</text>

  <!-- servos -->
  <g font-size="14" fill="#111827">
    <rect x="80" y="610" width="115" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="137" y="642" text-anchor="middle" font-weight="bold">S0 · R1</text>
    <text x="137" y="666" text-anchor="middle">GPIO 1</text>
    <text x="137" y="684" text-anchor="middle" fill="#6b7280">右前髋</text>

    <rect x="215" y="610" width="115" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="272" y="642" text-anchor="middle" font-weight="bold">S1 · R2</text>
    <text x="272" y="666" text-anchor="middle">GPIO 2</text>
    <text x="272" y="684" text-anchor="middle" fill="#6b7280">右前膝</text>

    <rect x="350" y="610" width="115" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="407" y="642" text-anchor="middle" font-weight="bold">S2 · L1</text>
    <text x="407" y="666" text-anchor="middle">GPIO 4</text>
    <text x="407" y="684" text-anchor="middle" fill="#6b7280">左前髋</text>

    <rect x="485" y="610" width="115" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="542" y="642" text-anchor="middle" font-weight="bold">S3 · L2</text>
    <text x="542" y="666" text-anchor="middle">GPIO 6</text>
    <text x="542" y="684" text-anchor="middle" fill="#6b7280">左前膝</text>

    <rect x="620" y="610" width="115" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="677" y="642" text-anchor="middle" font-weight="bold">S4 · R4</text>
    <text x="677" y="666" text-anchor="middle">GPIO 8</text>
    <text x="677" y="684" text-anchor="middle" fill="#6b7280">右后膝</text>

    <rect x="755" y="610" width="115" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="812" y="642" text-anchor="middle" font-weight="bold">S5 · R3</text>
    <text x="812" y="666" text-anchor="middle">GPIO 10</text>
    <text x="812" y="684" text-anchor="middle" fill="#6b7280">右后髋</text>

    <rect x="890" y="610" width="115" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="947" y="642" text-anchor="middle" font-weight="bold">S6 · L3</text>
    <text x="947" y="666" text-anchor="middle">GPIO 13</text>
    <text x="947" y="684" text-anchor="middle" fill="#6b7280">左后髋</text>

    <rect x="1025" y="610" width="95" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1072" y="642" text-anchor="middle" font-weight="bold">S7 · L4</text>
    <text x="1072" y="666" text-anchor="middle">GPIO 14</text>
    <text x="1072" y="684" text-anchor="middle" fill="#6b7280">左后膝</text>
  </g>

  <!-- OLED -->
  <rect x="840" y="120" width="280" height="180" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
  <text x="980" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#7c3aed">SSD1306 OLED</text>
  <text x="980" y="192" text-anchor="middle" font-size="15" fill="#374151">SDA → GPIO33</text>
  <text x="980" y="220" text-anchor="middle" font-size="15" fill="#374151">SCL → GPIO35</text>
  <text x="980" y="248" text-anchor="middle" font-size="15" fill="#374151">VCC → 5V 轨 / GND → GND 轨</text>
  <text x="980" y="276" text-anchor="middle" font-size="13" fill="#6b7280">3.3V 逻辑，供电 5V 常见</text>

  <!-- battery -->
  <rect x="80" y="120" width="280" height="180" rx="16" fill="#fff" stroke="#f59e0b" stroke-width="3"/>
  <text x="220" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#b45309">电源（可选）</text>
  <text x="220" y="192" text-anchor="middle" font-size="15" fill="#374151">2×14500 7.4V 800mAh</text>
  <text x="220" y="220" text-anchor="middle" font-size="15" fill="#374151">→ KCD1 开关 → 降压</text>
  <text x="220" y="248" text-anchor="middle" font-size="15" fill="#374151">降压输出调到 5.1V</text>
  <text x="220" y="276" text-anchor="middle" font-size="13" fill="#dc2626">不要剪原装插头 / 只用配套充电器</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="430" y1="230" x2="360" y2="230" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="210" x2="840" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="340" x2="600" y2="400" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="560" x2="600" y2="610" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="585" text-anchor="middle" font-size="13" fill="#6b7280">8 路信号 + 电源/地</text>
</svg>
