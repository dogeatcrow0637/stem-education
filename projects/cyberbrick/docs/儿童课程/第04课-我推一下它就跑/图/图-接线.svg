<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="800" height="600" fill="#101528"/>
  <text x="400" y="52" fill="#ffd166" font-size="34" text-anchor="middle" font-weight="bold">车上的插座板</text>

  <!-- receiver board -->
  <rect x="120" y="140" width="560" height="300" rx="18" fill="#1c2340" stroke="#4cc9f0" stroke-width="6"/>

  <!-- core slot -->
  <rect x="320" y="170" width="160" height="70" rx="10" fill="#4cc9f0"/>
  <text x="400" y="214" fill="#0f1220" font-size="22" text-anchor="middle" font-weight="bold">核心板</text>

  <!-- motor ports -->
  <rect x="160" y="300" width="90" height="60" rx="8" fill="#63e6be"/>
  <text x="205" y="338" fill="#0f1220" font-size="24" text-anchor="middle" font-weight="bold">M1</text>
  <rect x="270" y="300" width="90" height="60" rx="8" fill="#63e6be"/>
  <text x="315" y="338" fill="#0f1220" font-size="24" text-anchor="middle" font-weight="bold">M2</text>

  <!-- servo ports -->
  <rect x="400" y="300" width="60" height="60" rx="8" fill="#ff6b6b"/>
  <text x="430" y="338" fill="#0f1220" font-size="22" text-anchor="middle" font-weight="bold">S1</text>
  <rect x="470" y="300" width="60" height="60" rx="8" fill="#ff6b6b"/>
  <text x="500" y="338" fill="#0f1220" font-size="22" text-anchor="middle" font-weight="bold">S2</text>

  <!-- led ports -->
  <rect x="560" y="300" width="90" height="60" rx="8" fill="#c77dff"/>
  <text x="605" y="338" fill="#0f1220" font-size="22" text-anchor="middle" font-weight="bold">D1</text>

  <text x="400" y="400" fill="#9aa3b8" font-size="20" text-anchor="middle">M 电机 D 灯 S 舵机</text>
  <text x="400" y="510" fill="#9aa3b8" font-size="22" text-anchor="middle">每条线都能说出它去哪</text>
</svg>
