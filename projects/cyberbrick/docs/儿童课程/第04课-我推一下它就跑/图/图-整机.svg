<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="800" height="600" fill="#101528"/>
  <text x="400" y="54" fill="#ffd166" font-size="34" text-anchor="middle" font-weight="bold">一台遥控车，三样东西</text>

  <!-- car body -->
  <rect x="150" y="330" width="300" height="90" rx="18" fill="#4cc9f0"/>
  <rect x="200" y="280" width="150" height="60" rx="14" fill="#63e6be"/>
  <circle cx="215" cy="430" r="46" fill="#2b2f45" stroke="#f4a261" stroke-width="8"/>
  <circle cx="385" cy="430" r="46" fill="#2b2f45" stroke="#f4a261" stroke-width="8"/>
  <text x="300" y="500" fill="#9aa3b8" font-size="24" text-anchor="middle">车身（3D 打印）</text>

  <!-- remote -->
  <rect x="560" y="300" width="150" height="190" rx="20" fill="#3a3f5c"/>
  <circle cx="635" cy="360" r="30" fill="#ffd166"/>
  <circle cx="600" cy="440" r="14" fill="#f4a261"/>
  <circle cx="670" cy="440" r="14" fill="#f4a261"/>
  <text x="635" y="530" fill="#9aa3b8" font-size="24" text-anchor="middle">遥控器</text>

  <!-- radio link -->
  <path d="M470 350 q45 -40 88 0" stroke="#ff6b6b" stroke-width="5" fill="none" stroke-dasharray="10 8"/>
  <text x="516" y="330" fill="#ff6b6b" font-size="22" text-anchor="middle">信号</text>

  <text x="400" y="574" fill="#9aa3b8" font-size="22" text-anchor="middle">今天先认识，再让它跑起来</text>
</svg>
