<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="800" height="600" fill="#101528"/>
  <text x="400" y="52" fill="#ffd166" font-size="34" text-anchor="middle" font-weight="bold">打印机一层一层堆</text>

  <!-- printer frame -->
  <rect x="220" y="100" width="360" height="380" rx="14" fill="none" stroke="#4cc9f0" stroke-width="8"/>
  <!-- layers -->
  <rect x="270" y="400" width="260" height="22" fill="#63e6be"/>
  <rect x="270" y="378" width="260" height="22" fill="#63e6be" opacity="0.85"/>
  <rect x="270" y="356" width="260" height="22" fill="#63e6be" opacity="0.7"/>
  <rect x="270" y="334" width="260" height="22" fill="#63e6be" opacity="0.55"/>
  <rect x="270" y="312" width="260" height="22" fill="#63e6be" opacity="0.4"/>
  <!-- nozzle -->
  <path d="M395 180 l10 40 l-20 0 z" fill="#f4a261"/>
  <line x1="400" y1="130" x2="400" y2="180" stroke="#9aa3b8" stroke-width="6"/>
  <!-- filament -->
  <path d="M400 130 q60 -50 120 -10" stroke="#ffd166" stroke-width="6" fill="none"/>
  <text x="610" y="130" fill="#ffd166" font-size="22">塑料丝</text>

  <text x="400" y="530" fill="#9aa3b8" font-size="22" text-anchor="middle">要几小时，但它不喊累</text>
</svg>
