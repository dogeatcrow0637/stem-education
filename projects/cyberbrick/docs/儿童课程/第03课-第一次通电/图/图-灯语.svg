<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="800" height="600" fill="#101528"/>
  <text x="400" y="52" fill="#ffd166" font-size="34" text-anchor="middle" font-weight="bold">板上的灯会说话</text>

  <circle cx="140" cy="200" r="52" fill="#63e6be"/>
  <text x="140" y="290" fill="#63e6be" font-size="24" text-anchor="middle">绿灯常亮</text>
  <text x="140" y="322" fill="#9aa3b8" font-size="20" text-anchor="middle">等连接</text>

  <circle cx="340" cy="200" r="52" fill="#4cc9f0"/>
  <text x="340" y="290" fill="#4cc9f0" font-size="24" text-anchor="middle">蓝灯常亮</text>
  <text x="340" y="322" fill="#9aa3b8" font-size="20" text-anchor="middle">手机连上了</text>

  <circle cx="540" cy="200" r="52" fill="#ffe066"/>
  <text x="540" y="290" fill="#ffe066" font-size="24" text-anchor="middle">黄灯常亮</text>
  <text x="540" y="322" fill="#9aa3b8" font-size="20" text-anchor="middle">遥控连上了</text>

  <circle cx="700" cy="200" r="40" fill="#ffffff"/>
  <text x="700" y="270" fill="#ffffff" font-size="22" text-anchor="middle">白灯</text>
  <text x="700" y="300" fill="#9aa3b8" font-size="18" text-anchor="middle">电源/升级</text>

  <text x="400" y="440" fill="#9aa3b8" font-size="22" text-anchor="middle">黄灯亮 = 可以开车了</text>
  <text x="400" y="500" fill="#ff6b6b" font-size="22" text-anchor="middle">白灯闪时绝不能断电</text>
</svg>
