<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#101425"/>
  <g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" fill="#f7f8fb">
    <text x="40" y="56" font-size="30" fill="#ffd166">正确的顺序（从左到右）</text>
    <g font-size="26">
      <circle cx="130" cy="200" r="56" fill="#4cc9f0"/>
      <text x="112" y="210" fill="#101425">① 插线</text>
      <text x="70" y="300" font-size="22" fill="#9aa3b8">红对红、黑对黑</text>
      <path d="M200 200 h90" stroke="#9aa3b8" stroke-width="10" marker-end="url(#a)"/>
      <circle cx="390" cy="200" r="56" fill="#4cc9f0"/>
      <text x="362" y="210" fill="#101425">② 检查</text>
      <text x="330" y="300" font-size="22" fill="#9aa3b8">没有松动、没有短路</text>
      <path d="M460 200 h90" stroke="#9aa3b8" stroke-width="10" marker-end="url(#a)"/>
      <circle cx="650" cy="200" r="56" fill="#ffd166"/>
      <text x="622" y="210" fill="#101425">③ 送电</text>
      <text x="600" y="300" font-size="22" fill="#9aa3b8">家长来按，孩子退远</text>
    </g>
    <text x="40" y="400" font-size="26" fill="#63e6be">先连线，最后送电 —— 反了会坏东西</text>
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#9aa3b8"/>
      </marker>
    </defs>
  </g>
</svg>
